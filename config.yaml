llm_model: qwen2.5:latest
stt_model: large-v3-turbo
stt_compute_type: int8_float16
llm_num_ctx: 4096
tts_voice: af_heart
wake_word: hey_jarvis
wake_word_enabled: true
wake_threshold: 0.5
hotkey: ctrl+shift+alt+f5
max_silence_sec: 0.0
sample_rate: 16000
ollama_host: http://127.0.0.1:11434
ollama_gpu_overhead: 1610612736
max_history_turns: 12
system_prompt: You are Bob, a local voice assistant. Speak in short, natural sentences
  meant to be heard aloud. No markdown, bullet lists, or code fences unless the user
  asks. Keep answers concise.
show_overlay: false
start_with_windows: false
input_device: ''
output_device: ''
memory_autosave: true
memory_max_inject: 8
tools_enabled: true
tool_timeout_sec: 20.0
max_tool_rounds: 4
mcp_servers: []
